<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOVA — Luxury Bags Retailer</title>
    <link rel="icon" type="image/png" href="favicon.png">

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=Playfair+Display:wght@400;500&display=swap">
    <link rel="stylesheet" href="login-styles.css">
</head>

<body>
    <section>
        <div id="all-screen">
            <div id="log-in-form">
                <h1>Welcome to <span>NOVA</span>!</h1>
                <h3>Log In</h3>

                <form id="login-form">
                    <div class="input-group">
                        <label for="username">Username or Email</label>
                        <input type="text" id="username" name="username" placeholder="Enter your username or email" required>
                    </div>

                    <div class="input-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" placeholder="Enter your password" required>
                    </div>

                    <button type="submit" id="login-button">Log In</button>
                    <p id="loginMessage"></p>
                </form>

                <p>or</p>

                <div class="input-group">
                    <button type="button" id="guest-account">Continue as Guest</button>
                </div>
            </div>

            <div id="side-picture">
                <div id="image-text">
                    <h2>Beyond the Stars</h2>
                    <p>Let your fashion shine brighter than ever.</p>
                </div>
            </div>
        </div>
    </section>
    <script src="app.js"></script>
</body>
</html>
